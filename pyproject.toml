[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101", "S308", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "DJ"]
"apps/core/testing.py" = ["S"]
"HairClub/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "HairClub"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
