{% load core_tags %}
<div class="feature-card d-flex flex-column">
  <div class="feature-icon"><i class="bi bi-{{ service.icon|default:'scissors' }}"></i></div>
  <h3 class="h5 mb-2">{{ service.name }}</h3>
  <p class="text-muted flex-grow-1">{{ service.short_description }}</p>
  <div class="service-meta mb-3">
    <span><i class="bi bi-clock me-1"></i>{{ service.duration_minutes }} min</span>
    <span><i class="bi bi-tag me-1"></i>{% if service.starting_price %}From {{ service.starting_price|money }}{% else %}Price on consultation{% endif %}</span>
  </div>
  <a href="{{ service.get_book_url }}" class="btn btn-outline-dark btn-sm align-self-start">Book this treatment <i class="bi bi-arrow-right ms-1"></i></a>
</div>
