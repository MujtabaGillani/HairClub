{% load static core_tags %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Invoice {{ invoice.number }} · {{ site.business_name }}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>
<body class="invoice-public">
  <main class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 invoice-public-bar">
      <div class="small text-muted">Invoice {{ invoice.number }} from <strong class="text-body">{{ site.business_name }}</strong></div>
      <div class="d-flex gap-2">
        <a href="{% url 'invoices:public_pdf' invoice.public_token %}?download=1" class="btn btn-dark btn-sm"><i class="bi bi-download me-1"></i>Download PDF</a>
        <a href="https://wa.me/{{ site.whatsapp_number }}" class="btn btn-whatsapp btn-sm" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1"></i>Questions?</a>
      </div>
    </div>
    <div class="invoice-preview-frame">{% include "invoices/partials/document.html" %}</div>
  </main>
</body>
</html>
