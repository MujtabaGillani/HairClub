{% load allauth %}
<div class="mb-3{% if attrs.type == 'checkbox' or attrs.type == 'radio' %} form-check{% endif %}">
  {% if attrs.type == "textarea" %}
    <label class="form-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    <textarea class="form-control{% if attrs.errors %} is-invalid{% endif %}" {% if attrs.required %}required{% endif %} {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
  {% elif attrs.type == "checkbox" or attrs.type == "radio" %}
    <input class="form-check-input" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.checked %}checked{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}">
    <label class="form-check-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  {% else %}
    <label class="form-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    <input class="form-control{% if attrs.errors %} is-invalid{% endif %}" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}">
  {% endif %}
  {% if slots.help_text %}<div class="form-text">{% slot help_text %}{% endslot %}</div>{% endif %}
  {% for error in attrs.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
