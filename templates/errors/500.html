<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | HairClub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf7f2; color: #1b1a1f; text-align: center; padding: 1.5rem; }
    .mark { width: 64px; height: 64px; border-radius: 50%; background: #1b1a1f; color: #c4a27a; display: grid; place-items: center; font: 700 1.6rem Georgia, serif; margin: 0 auto 1.5rem; }
    h1 { font-family: Georgia, serif; margin: 0 0 .5rem; }
    p { color: #6b6570; max-width: 420px; margin: 0 auto 1.5rem; }
    a { display: inline-block; background: #1b1a1f; color: #fff; padding: .7rem 1.4rem; border-radius: 999px; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #141317; color: #ece7e1; }
      .mark { box-shadow: inset 0 0 0 1px rgba(196, 162, 122, .35); }
      p { color: #a59ea8; }
      a { background: #ece7e1; color: #1b1a1f; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">H</div>
    <h1>Something went wrong</h1>
    <p>We've been notified and are looking into it. Please try again in a moment.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
